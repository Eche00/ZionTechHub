name: Deploy to cPanel

on:
  push:
    branches: [ main ] # Triggers on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build
        # The 'build' script creates a folder (e.g., 'build' or 'dist')

      - name: Deploy to Truehost (cPanel)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }} # Usually /public_html/
          local-dir: ./build/ # <<< CRITICAL: Change this!
          # If your project uses Vite, change 'build' to 'dist'
